server {
    listen 80;
    server_name _;

    root /var/www/enlitenment/_output;
    index index.html;

    # --- Required for Pyodide (SharedArrayBuffer) ---
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # --- Static asset caching ---
    # WASM, JS bundles, fonts — immutable after build, cache aggressively
    location ~* \.(wasm|js|css|woff2?)$ {
        expires 180d;
        add_header Cache-Control "public, immutable";
        # Re-add COOP/COEP since add_header in a location block
        # overrides the server-level headers
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Notebook JSON and landing page — short cache so updates propagate
    location ~* \.(ipynb|html)$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # --- Gzip for text-based assets ---
    gzip on;
    gzip_types application/javascript application/wasm application/json text/css text/html;
    gzip_min_length 1000;

    # --- Connection handling for burst load ---
    # With 4 workers, nginx can handle thousands of concurrent static requests.
    # These settings prevent any single client from hogging connections.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn perip 20;

    location / {
        try_files $uri $uri/ =404;
    }
}
